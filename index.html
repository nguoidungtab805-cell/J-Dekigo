<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>J-DEKI GO</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,"Noto Sans JP",sans-serif;
  background:#fffdf9;
  color:#333;
  overflow-x:hidden;
}

button,
a{
  font:inherit;
}

button{
  border:0;
  background:none;
  cursor:pointer;
}

a{
  text-decoration:none;
}

/* =========================
   SIDEBAR + BACKGROUND
========================= */

body::before{
  content:"";
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:164px;

  background:
    url("YOUR_LEFT_BACKGROUND_IMAGE")
    left top/
    164px 643px
    repeat-y;

  z-index:-2;
}

body::after{
  content:"";
  position:fixed;
  right:0;
  top:0;
  bottom:0;
  width:65px;

  background:
    url("YOUR_RIGHT_BACKGROUND_IMAGE")
    right top/
    65px 643px
    repeat-y;

  z-index:-2;
}

/* =========================
   MAIN SIDEBAR
========================= */

.sidebar{
  position:fixed;
  z-index:50;

  left:15px;
  top:15px;

  width:86px;
  height:calc(100vh - 30px);

  background:
    url("YOUR_SIDEBAR_IMAGE")
    center top/
    86px 614px
    no-repeat;
}

/* vùng click menu */

.side-hit{
  position:absolute;

  left:0;

  width:86px;
  height:57px;

  border-radius:15px;

  cursor:pointer;
}

.side-home{
  top:88px;
}

.side-grammar{
  top:145px;
}

.side-vocab{
  top:202px;
}

.side-kanji{
  top:259px;
}

.side-test{
  top:316px;
}

.side-video{
  top:373px;
}

.side-speaking{
  top:430px;
}

.side-course{
  top:487px;
}

.side-account{
  top:544px;
}

/* =========================
   MAIN PAGE
========================= */

.page{
  width:1134px;

  margin-left:164px;

  padding-top:31px;
  padding-bottom:35px;
}

/* =========================
   COMMON IMAGE SECTION
========================= */

.section-image{
  position:relative;

  width:1134px;
}

/* =========================
   HERO
========================= */

.hero{
  height:220px;

  border-radius:23px;

  overflow:hidden;

  background:
    url("YOUR_HERO_IMAGE")
    center/
    100% 100%
    no-repeat;
}

/* =========================
   INTRO + RECENT
========================= */

.intro-row{
  display:grid;

  grid-template-columns:
    740px
    382px;

  gap:12px;

  margin-top:9px;
}

.intro,
.recent{
  height:273px;

  border-radius:18px;

  overflow:hidden;

  background-position:center;
  background-size:100% 100%;
  background-repeat:no-repeat;
}

.intro{
  background-image:
    url("YOUR_INTRO_IMAGE");
}

.recent{
  background-image:
    url("YOUR_RECENT_IMAGE");
}

/* =========================
   MAIN FUNCTIONS
========================= */

.functions{
  height:243px;

  margin-top:12px;

  background:
    url("YOUR_FUNCTIONS_IMAGE")
    center/
    100% 100%
    no-repeat;
}

/* =========================
   SURVEY
========================= */

.survey{
  height:230px;

  margin-top:12px;

  background:
    url("YOUR_SURVEY_IMAGE")
    center/
    100% 100%
    no-repeat;
}

/* =========================
   TRANSPARENT CLICK AREAS
========================= */

.hit{
  position:absolute;

  display:block;

  background:transparent;

  border:0;

  cursor:pointer;

  z-index:5;
}

/* Hero */

.hero-alphabet{
  left:16px;
  top:114px;

  width:136px;
  height:91px;
}

.hero-test{
  left:164px;
  top:114px;

  width:136px;
  height:91px;
}

/* Main functions */

.fn-1{
  left:0;
  top:34px;

  width:179px;
  height:207px;
}

.fn-2{
  left:191px;
  top:34px;

  width:179px;
  height:207px;
}

.fn-3{
  left:382px;
  top:34px;

  width:179px;
  height:207px;
}

.fn-4{
  left:573px;
  top:34px;

  width:179px;
  height:207px;
}

.fn-5{
  left:764px;
  top:34px;

  width:179px;
  height:207px;
}

.fn-6{
  left:955px;
  top:34px;

  width:179px;
  height:207px;
}

/* Survey */

.survey-before{
  left:17px;
  top:30px;

  width:223px;
  height:166px;
}

.survey-after{
  left:489px;
  top:30px;

  width:224px;
  height:166px;
}

.thanks-hit{
  right:0;
  top:0;

  width:392px;
  height:230px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1200px){

  body::before,
  body::after,
  .sidebar{
    display:none;
  }

  .page{
    width:100%;
    max-width:1134px;

    margin:0 auto;

    padding:15px;
  }

  .section-image{
    width:100%;
  }

  .hero{
    height:auto;

    aspect-ratio:1134/220;
  }

  .intro-row{
    grid-template-columns:
      minmax(0,1.937fr)
      minmax(260px,1fr);
  }

  .intro,
  .recent{
    height:auto;

    aspect-ratio:740/273;
  }

  .functions{
    height:auto;

    aspect-ratio:1134/243;
  }

  .survey{
    height:auto;

    aspect-ratio:1134/230;
  }

  .hit{
    transform:
      scale(
        calc(100vw / 1134)
      );

    transform-origin:
      top left;
  }
}

/* =========================
   MOBILE
========================= */

@media(max-width:760px){

  .page{
    padding:8px;
  }

  .intro-row{
    grid-template-columns:1fr;
  }

  .recent{
    aspect-ratio:382/273;
  }

  .hero{
    min-height:220px;
  }

  .functions,
  .survey{
    min-height:180px;

    overflow:hidden;
  }
}
</style>
</head>


<body>

<!-- ======================================
     SIDEBAR
====================================== -->

<aside
  class="sidebar"
  aria-label="Điều hướng"
>

  <a
    class="side-hit side-home"
    href="#home"
    aria-label="Trang chủ">
  </a>

  <a
    class="side-hit side-grammar"
    href="#grammar"
    aria-label="Ngữ pháp">
  </a>

  <a
    class="side-hit side-vocab"
    href="#vocabulary"
    aria-label="Từ vựng">
  </a>

  <a
    class="side-hit side-kanji"
    href="#kanji"
    aria-label="Kanji">
  </a>

  <a
    class="side-hit side-test"
    href="#test"
    aria-label="Kiểm tra">
  </a>

  <a
    class="side-hit side-video"
    href="#video"
    aria-label="Video">
  </a>

  <a
    class="side-hit side-speaking"
    href="#speaking"
    aria-label="Speaking">
  </a>

  <a
    class="side-hit side-course"
    href="#courses"
    aria-label="Học phần">
  </a>

  <a
    class="side-hit side-account"
    href="#account"
    aria-label="Tài khoản">
  </a>

</aside>


<!-- ======================================
     MAIN CONTENT
====================================== -->

<main class="page">

  <!-- =========================
       HERO
  ========================== -->

  <section
    id="home"
    class="section-image hero"
    aria-label="J-DEKI GO"
  >

    <button
      class="hit hero-alphabet"
      onclick="openFeature('alphabet')"
      aria-label="Bảng chữ cái">
    </button>

    <button
      class="hit hero-test"
      onclick="openFeature('test')"
      aria-label="Kiểm tra ngay">
    </button>

  </section>


  <!-- =========================
       INTRO
  ========================== -->

  <section class="intro-row">

    <div
      class="intro section-image"
      aria-label="Giới thiệu">
    </div>


    <div
      id="courses"
      class="recent section-image"
      aria-label="Học phần gần đây">
    </div>

  </section>


  <!-- =========================
       MAIN FUNCTIONS
  ========================== -->

  <section
    id="grammar"
    class="section-image functions"
    aria-label="Chức năng chính"
  >

    <a
      class="hit fn-1"
      href="#grammar"
      aria-label="Ngữ pháp">
    </a>

    <a
      class="hit fn-2"
      href="#vocabulary"
      aria-label="Từ vựng">
    </a>

    <a
      class="hit fn-3"
      href="#kanji"
      aria-label="Kanji">
    </a>

    <a
      class="hit fn-4"
      href="#video"
      aria-label="Video">
    </a>

    <a
      class="hit fn-5"
      href="#speaking"
      aria-label="Speaking">
    </a>

    <a
      class="hit fn-6"
      href="#courses"
      aria-label="Học phần">
    </a>

  </section>


  <!-- =========================
       SURVEY
  ========================== -->

  <section
    id="test"
    class="section-image survey"
    aria-label="Khảo sát"
  >

    <button
      class="hit survey-before"
      onclick="goToSurvey('before')"
      aria-label="Khảo sát trước khi sử dụng">
    </button>


    <button
      class="hit survey-after"
      onclick="goToSurvey('after')"
      aria-label="Khảo sát sau khi sử dụng">
    </button>


    <button
      class="hit thanks-hit"
      onclick="openFeature('thanks')"
      aria-label="Cảm ơn bạn">
    </button>

  </section>


  <!-- =========================
       NAVIGATION TARGETS
  ========================== -->

  <span id="vocabulary"></span>

  <span id="kanji"></span>

  <span id="video"></span>

  <span id="speaking"></span>

  <span id="account"></span>

</main>


<!-- ======================================
     JAVASCRIPT
====================================== -->

<script>

/*
 * ================================
 * FEATURE NAVIGATION
 * ================================
 *
 * Nếu bạn đang dùng Google Apps Script,
 * thay phần console.log bằng function
 * điều hướng hiện tại của bạn.
 */

function openFeature(name){

  console.log(
    "J-DEKI GO:",
    name
  );

}


/*
 * ================================
 * SURVEY
 * ================================
 *
 * Thay URL bằng Google Form thực tế.
 */

function goToSurvey(type){

  const urls = {

    before: "",

    after: ""

  };


  if(urls[type]){

    window.open(
      urls[type],
      "_blank"
    );

  }else{

    console.log(
      "Survey:",
      type
    );

  }

}

</script>

</body>
</html>
